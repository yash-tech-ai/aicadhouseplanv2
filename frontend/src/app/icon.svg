<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Background circle -->
  <circle cx="32" cy="32" r="32" fill="#2563eb"/>

  <!-- House structure -->
  <g transform="translate(32, 32)">
    <!-- Roof -->
    <path d="M -16 -8 L 0 -20 L 16 -8 Z" fill="#ffffff" stroke="#e0e7ff" stroke-width="1.5"/>

    <!-- House body -->
    <rect x="-16" y="-8" width="32" height="24" fill="#ffffff" stroke="#e0e7ff" stroke-width="1.5"/>

    <!-- Door -->
    <rect x="-6" y="4" width="8" height="12" fill="#93c5fd" stroke="#2563eb" stroke-width="1"/>

    <!-- Window left -->
    <rect x="-13" y="-2" width="6" height="6" fill="#dbeafe" stroke="#2563eb" stroke-width="0.5"/>
    <line x1="-13" y1="1" x2="-7" y2="1" stroke="#2563eb" stroke-width="0.5"/>
    <line x1="-10" y1="-2" x2="-10" y2="4" stroke="#2563eb" stroke-width="0.5"/>

    <!-- Window right -->
    <rect x="7" y="-2" width="6" height="6" fill="#dbeafe" stroke="#2563eb" stroke-width="0.5"/>
    <line x1="7" y1="1" x2="13" y2="1" stroke="#2563eb" stroke-width="0.5"/>
    <line x1="10" y1="-2" x2="10" y2="4" stroke="#2563eb" stroke-width="0.5"/>

    <!-- Ruler/measurement lines (blueprint style) -->
    <line x1="-18" y1="18" x2="18" y2="18" stroke="#ffffff" stroke-width="0.5" opacity="0.8"/>
    <line x1="-18" y1="18" x2="-18" y2="16" stroke="#ffffff" stroke-width="0.5" opacity="0.8"/>
    <line x1="18" y1="18" x2="18" y2="16" stroke="#ffffff" stroke-width="0.5" opacity="0.8"/>
  </g>
</svg>
